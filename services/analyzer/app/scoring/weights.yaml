# CodeMRI scoring configuration.
# Every scoring number lives here so tuning never needs code changes.

severity_points:
  critical: 25
  high: 12
  medium: 5
  low: 2
  info: 0

confidence_multiplier:
  high: 1.0
  medium: 0.6
  low: 0.3

# Base category weights (sum: 1.0)
category_weights:
  security: 0.20
  dependencies: 0.10
  code_quality: 0.15
  documentation: 0.10
  testing: 0.15
  architecture: 0.15
  deployment: 0.05
  git_hygiene: 0.05
  maintainability: 0.05
  fingerprint: 0.0

# Repeating the same rule must not zero a category:
# occurrences 1-3 full penalty, 4-10 half penalty, beyond 10th: 0.1x
diminishing_returns:
  full_occurrences: 3
  half_until_occurrences: 10
  tail_multiplier: 0.1

labels:
  - {min_score: 90, label: Excellent}
  - {min_score: 75, label: Good}
  - {min_score: 60, label: Fair}
  - {min_score: 40, label: Needs work}
  - {min_score: 0, label: At risk}

# Target modes re-weight categories; severity multipliers scale penalties
# for specific categories before the category score is computed.
target_modes:
  portfolio:
    category_weight_multiplier:
      documentation: 1.6
      testing: 1.4
      deployment: 1.4
    severity_multiplier_by_category: {}
  university:
    category_weight_multiplier:
      testing: 1.4
      documentation: 1.4
      code_quality: 1.3
      architecture: 0.6
      deployment: 0.5
    severity_multiplier_by_category: {}
  production:
    category_weight_multiplier:
      security: 1.4
      testing: 1.3
      deployment: 1.3
      dependencies: 1.3
    severity_multiplier_by_category:
      security: 1.25
      dependencies: 1.25

# Effort estimate (S=1, M=2, L=4) used by the recommendation ranking:
# priority = (severity_points * confidence_multiplier * category_weight) / effort
effort_by_rule:
  SEC-001: S
  SEC-002: S
  SEC-003: M
  SEC-004: M
  SEC-005: M
  DEP-001: M
  DEP-002: L
  DEP-003: S
  DEP-004: S
  DEP-005: S
  QUA-001: M
  QUA-002: M
  QUA-003: M
  QUA-004: S
  TST-001: L
  TST-002: S
  TST-003: M
  TST-004: S
  DOC-001: M
  DOC-002: M
  DOC-003: S
  DOC-004: S
  ARC-001: L
  ARC-002: M
  ARC-003: S
  GIT-001: S
  GIT-002: S
  GIT-003: S
  GIT-004: S
  DEP-LY-001: M
  MNT-001: L
default_effort: M
